[project]
name = "job-discovery"
version = "0.1.0"
description = "Automated job discovery and screening pipeline"
authors = [{ name = "Mohammed" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "python-jobspy>=1.1.80",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "ollama>=0.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "apscheduler>=3.10",
    # Triage interface (ADR-0004, replacing Notion delivery)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
job-discovery = "app.__main__:app"

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Dependency injection in argument defaults is the intended FastAPI and Typer
# idiom; B008 flags it only because it cannot distinguish these from mutable
# defaults evaluated once at import.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Form",
    "fastapi.Query",
    "typer.Option",
    "typer.Argument",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
