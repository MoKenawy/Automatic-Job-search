# Continuous integration.
#
# The Python project lives in app/, not at the repository root, so every step
# that touches it sets `working-directory: app` and every path filter is
# written against the nested layout.

name: CI

# Path filters keep doc-only changes off the runners. The lists are written
# out twice on purpose: GitHub Actions does not expand YAML anchors/aliases in
# workflow files, so `&anchor` / `*alias` here would be a parse error.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/ci.yml'

# NOTE on branch protection: a job filtered out by `paths` never reports a
# status, so a doc-only PR will sit forever behind a required check that never
# runs. If these jobs are made required, add a companion job with no path
# filter that always succeeds, and require that one instead.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Ruff and pytest read their configuration from app/pyproject.toml.
  UV_FROZEN: '1'

jobs:
  # --- Lint and tests -------------------------------------------------------
  # No service containers. The suite is deliberately runnable without Docker:
  # web tests use in-memory SQLite with a StaticPool, and the models declare a
  # JSON variant of their JSONB columns precisely so this works. Keep it that
  # way — if a test starts needing Postgres, that is a design problem to fix in
  # the test, not a service to add here.
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          # Path is repository-relative, not working-directory-relative.
          cache-dependency-glob: app/uv.lock

      # Installs the interpreter pinned by app/.python-version (3.12) and the
      # exact locked graph. --frozen fails if uv.lock is out of date with
      # pyproject.toml rather than quietly relocking, which is what we want in
      # CI: a lockfile drift should be visible, not silently repaired.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      # Type checking is deliberately SCOPED, not repository-wide.
      #
      # Measured before this was added (mypy inside the project venv, so
      # dependency types actually resolve):
      #
      #   whole src/, --ignore-missing-imports ...  6 errors, all in
      #                                             services/queries.py
      #   whole src/, --strict .................... 93 errors, mostly
      #                                             untyped Typer/FastAPI
      #                                             decorators
      #   normalise/ + config.py, --strict ........ 0 errors
      #
      # So the scoped gate is green on day one at full strictness, while a
      # repository-wide one would fail immediately and be disabled within a
      # week. The scope is not arbitrary: these are the pure, database-free
      # modules the architecture already isolates, where a type error is a
      # real defect rather than an artifact of an untyped decorator.
      #
      # The 6 errors in services/queries.py are genuine but low-value —
      # SQLAlchemy `Row[...]` is tuple-like at runtime and the complaints are
      # variance shims. Fixing them is a good follow-up PR; widening this
      # scope should happen then, not before.
      #
      # `uv run --with mypy` keeps mypy out of the project's dependency
      # groups: it is a CI tool, not something every contributor must install.
      - name: Type check (normalise/ and config.py, strict)
        run: |
          uv run --with mypy mypy \
            --ignore-missing-imports \
            --follow-imports=silent \
            --strict \
            src/app/normalise src/app/config.py

      - name: Test
        run: uv run pytest -q

  # --- Migration round trip -------------------------------------------------
  # Mirrors the manual check the development guide requires of every schema
  # change: upgrade head, downgrade one, upgrade head again. Autogenerated
  # downgrades are frequently wrong or absent, and the failure mode is only
  # discovered when a rollback is needed under pressure.
  migrations:
    name: Migration round trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        # Must match the image in app/docker-compose.yml: the initial migration
        # issues CREATE EXTENSION vector, which plain postgres:16 cannot do.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Alembic reads the URL from app.config.settings, not alembic.ini, so it
      # is set here as an environment variable. These are the same throwaway
      # development credentials documented in .env.example; the container is
      # destroyed when the job ends.
      DATABASE_URL: postgresql+psycopg://jobs:jobs@localhost:5432/jobs
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: app/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Downgrade one revision
        run: uv run alembic downgrade -1

      - name: Upgrade to head again
        run: uv run alembic upgrade head

      # A migration that leaves the schema out of step with the models means
      # the next autogenerate produces a spurious diff. This catches it at the
      # point the migration is written rather than months later.
      - name: Check the models and the schema agree
        run: |
          uv run alembic check

  # --- Container build ------------------------------------------------------
  # The same image serves web, scheduler and migrate (ADR-0004), so a broken
  # Dockerfile breaks deployment entirely while every test still passes.
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile declares `# syntax=docker/dockerfile:1` and uses
      # RUN --mount=type=cache, both of which need BuildKit.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: app
          # Not pushed and not loaded into the daemon: this job verifies the
          # build succeeds, nothing runs the result.
          push: false
          load: false
          tags: job-discovery:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
